# Training configuration for Cardiovascular Risk Prediction Models

seed: 42
device: "cuda"

data:
  features_path: "data/processed/features_unscaled.csv"
  targets_path: "data/processed/targets.csv"
  drop_features:
    - name: "Exertional CP"
      reason: "Zero variance: constant value 'N' across all 303 rows in dataset."

targets:
  - name: "Cath"
    display_name: "Overall CAD"
  - name: "LAD"
    display_name: "LAD Stenosis"
  - name: "LCX"
    display_name: "LCX Stenosis"
  - name: "RCA"
    display_name: "RCA Stenosis"

cv:
  outer_repeats: 5
  outer_folds: 5
  inner_folds: 3

models:
  xgboost:
    enabled: true
    device: "cuda"
    tree_method: "hist"
    eval_metric: "logloss"
    param_grid:
      max_depth: [3, 4]
      learning_rate: [0.05, 0.1]
      n_estimators: [80, 150]
      subsample: [0.8, 1.0]

  logistic_regression:
    enabled: true
    device: "cuda"
    epochs: 200
    param_grid:
      lr: [0.01, 0.05]
      weight_decay: [0.0001, 0.001, 0.01]

  mlp:
    enabled: true
    device: "cuda"
    max_epochs: 200
    patience: 20
    param_grid:
      hidden_dims:
        - [64, 32]
        - [96, 48]
      dropout: [0.2, 0.3]
      lr: [0.001, 0.003]
      weight_decay: [0.0001, 0.001]

  ensemble_mlp:
    enabled: true
    device: "cuda"
    n_members: 20
    hidden_dims: [64, 32]
    dropout: 0.25
    lr: 0.002
    weight_decay: 0.0005
    epochs: 180

metrics:
  n_bootstraps: 1000
  ci_level: 0.95
  use_gpu_bootstrap: true

outputs:
  metrics_json: "reports/metrics.json"
  metrics_csv: "reports/metrics.csv"
  gpu_log_json: "reports/gpu_log.json"
  oof_predictions_parquet: "reports/oof_predictions.parquet"
  models_dir: "models"
